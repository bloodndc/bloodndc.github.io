  <meta property="og:image" content="https://onedropndc.github.io/assets/img/logo-full.png">
  <meta property="og:url" content="https://onedropndc.github.io/offline.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="You are offline — One Drop">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css?v=1.7.0">

  <meta name="robots" content="noindex">
  <style>
    .offline-wrap { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 2rem 1rem; }
    .offline-card { max-width: 460px; }
    .offline-mark { width: 74px; height: 74px; margin: 0 auto 1rem; border-radius: 24px; display: grid; place-items: center;
      background: var(--red-50); color: var(--red); }
  </style>
</head>
<body>
  <main id="main">
    <div class="offline-wrap">
      <div class="offline-card">
        <div class="offline-mark">
          <svg viewBox="0 0 24 24" style="width:38px;height:38px"><path d="M3 9.5a14 14 0 0 1 18 0M6.5 13a9 9 0 0 1 11 0M10 16.4a4 4 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="19.4" r="1.3" fill="currentColor"/><path d="m3 3 18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <h1 style="font-size:1.9rem">You are offline</h1>
        <p class="muted" style="margin:.6rem 0 1.4rem">
          One Drop itself still works — this page came from your device’s cache. Live donor data and new emergency
          requests need a connection.
        </p>
        <div style="display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="location.reload()">Try again</button>
          <a class="btn btn-ghost" href="index.html">Open home</a>
        </div>
        <p class="muted small" style="margin-top:1.4rem">For a life-threatening emergency, call <strong>999</strong> or the hospital blood bank directly.</p>
      </div>
    </div>
  </main>

  <script type="module">
    import { bootUI } from './assets/js/app.js';
    bootUI('home');
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
